<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="paul kwiatkowski // writing, reflections, and portfolio updates">
<title>blog · contrapaul</title>
<link rel="stylesheet" href="WEB/css/jetbrains-mono.css">
<style>
/* Warm editorial theme (shared with style.css) — slick chrome, readable content.
   JetBrains Mono is reserved for UI details; serif headlines + sans body do the reading. */
:root {
  --bg:          #faf7f2;
  --surface:     #f2ede4;
  --surface-2:   #e8e0d0;
  --border:      #d8cfc0;
  --text:        #1a1712;
  --muted:       #7a7060;
  --accent:      #c0522a;   /* terracotta */
  --accent-dark: #a04020;
  --accent-light:#f0e0d8;
  --font-display: Georgia, "Times New Roman", serif;
  --font-body:    "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono:    'JetBrains Mono', "Courier New", monospace;
  --transition:   180ms ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent-light); }

/* ========== HEADER (shared with contrapaul.com) ========== */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(250,247,242,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 2rem;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.wordmark {
  font-family: var(--font-mono);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  transition: color var(--transition);
}
.wordmark:hover { color: var(--accent); }
.nav { display: flex; gap: 0.35rem; }
.nav a {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.35rem 0.75rem;
  color: var(--muted);
  transition: color var(--transition), border-color var(--transition), background var(--transition);
}
.nav a:hover { color: var(--text); }
.nav-tag {
  border: 1px solid var(--border);
  border-radius: 3px;
}
.nav-tag:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.nav-tag.active {
  border-color: var(--accent);
  color: var(--accent-dark);
  background: var(--accent-light);
}

/* ========== LAYOUT: side menu + post stack ========== */
.layout {
  max-width: 1340px;
  width: 100%;
  margin: 0 auto;
  padding: 2.5rem 2rem 6rem;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 2rem;
}
/* Invisible left gutter that mirrors the menu width, so the post stack
   stays centered on the page rather than being pushed by the menu. */
.layout-spacer { flex: 0 0 230px; }

/* ----- side menu (right) ----- */
.sidemenu {
  position: sticky;
  top: 84px;
  flex: 0 0 230px;
  width: 230px;
}
.sidemenu-toggle {
  display: none;
  width: 100%;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.6rem 0.9rem;
  cursor: pointer;
  text-align: left;
}
.sidemenu-heading {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.75rem;
  padding-left: 0.85rem;
}
.sidemenu-list { display: flex; flex-direction: column; }
.sidemenu-list a {
  font-size: 0.8rem;
  line-height: 1.4;
  padding: 0.5rem 0.85rem;
  border-left: 2px solid transparent;
  color: var(--muted);
  transition: color var(--transition), border-color var(--transition);
}
.sidemenu-list a:hover {
  color: var(--accent);
  border-left-color: var(--accent);
}

/* ----- post stack ----- */
.post-stack {
  flex: 0 1 800px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}

/* ========== POST CARD (glass frame, warm edition) ========== */
@property --glass-angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}
@keyframes glass-spin {
  to { --glass-angle: 360deg; }
}
.post-card {
  border-radius: 20px;
  padding: 4px;
  background: conic-gradient(from var(--glass-angle),
    rgba(192,82,42,0.30), rgba(216,207,192,0.4), rgba(192,82,42,0.30));
  animation: glass-spin 8s linear infinite;
  scroll-margin-top: 84px;
}
.post-card-interior {
  border-radius: 16px;
  padding: 1.75rem;
  background: #fff;
  border: 1px solid var(--border);
  box-shadow: 0 1px 2px rgba(26,23,18,0.04), 0 12px 32px rgba(26,23,18,0.05);
}
.post-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.post-tag {
  display: inline-block;
  font-family: var(--font-mono);
  background: var(--accent-light);
  color: var(--accent-dark);
  padding: 0.3rem 0.75rem;
  border-radius: 20px;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
}
.post-date {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.post-card h2 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.25;
  margin-bottom: 0.75rem;
  color: var(--text);
}
.post-excerpt {
  font-size: 0.875rem;
  line-height: 1.65;
  color: var(--muted);
  margin-bottom: 1.25rem;
  max-width: 65ch;
}
.post-actions {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.post-btn {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  padding: 0.5rem 0.9rem;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: rgba(192,82,42,0.05);
  cursor: pointer;
  color: var(--accent);
  transition: background 0.2s ease, color 0.2s ease;
}
.post-btn:hover { background: var(--accent); color: #fff; }

/* ----- embedded post body ----- */
.post-body {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.post-body iframe {
  display: block;
  width: 100%;
  border: 0;
  background: #fff;
}

/* ========== FOOTER (shared with contrapaul.com) ========== */
.site-footer {
  margin-top: auto;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--muted);
}

/* ========== MOBILE ========== */
@media (max-width: 860px) {
  .layout { flex-direction: column; gap: 1.25rem; }
  .layout-spacer { display: none; }
  .sidemenu {
    position: static;
    flex: none;
    width: 100%;
    order: -1;
  }
  .sidemenu-heading { display: none; }
  .sidemenu-toggle { display: block; }
  .sidemenu-list {
    display: none;
    margin-top: 0.6rem;
    border-left: 1px solid var(--border);
  }
  .sidemenu.open .sidemenu-list { display: flex; }
}

.posts-status {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--muted);
  padding: 1rem 0.25rem;
}
</style>
</head>
<body>
<header class="site-header">
<div class="header-inner">
<a href="https://contrapaul.com" class="wordmark">contrapaul</a>
<nav class="nav">
<a href="https://make.contrapaul.com" class="nav-tag">Make</a>
<a href="https://edu.contrapaul.com" class="nav-tag">Edu</a>
<a href="https://blog.contrapaul.com" class="nav-tag active">Blog</a>
</nav>
</div>
</header>

<main>
<div class="layout">

<!-- Left gutter: balances the right menu so the stack stays centered -->
<div class="layout-spacer" aria-hidden="true"></div>

<!-- Post stack (newest first) — populated automatically from posts/manifest.json -->
<section class="post-stack" id="postStack">
<p class="posts-status" id="postsStatus">Loading posts…</p>
</section>

<!-- Side menu (right) -->
<aside class="sidemenu" id="sidemenu">
<button class="sidemenu-toggle" id="sidemenuToggle" aria-expanded="false">Recent posts ▾</button>
<p class="sidemenu-heading">Recent posts</p>
<nav class="sidemenu-list" id="sidemenuList"></nav>
</aside>

</div>
</main>

<footer class="site-footer">
<div class="footer-inner">
<span class="footer-name">contrapaul</span>
<span class="footer-location">Shenzhen, China</span>
</div>
</footer>

<script>
(function () {
  // Mobile side-menu toggle
  var sidemenu = document.getElementById('sidemenu');
  var toggle = document.getElementById('sidemenuToggle');
  toggle.addEventListener('click', function () {
    var open = sidemenu.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // Embedded post bodies: hide each post's own header/footer/back-link and
  // size the iframe to its content. Posts are same-origin, so this is allowed.
  function fitFrame(frame) {
    try {
      var doc = frame.contentDocument;
      if (!doc) return;
      var css = doc.createElement('style');
      css.textContent =
        'html,body{background:#fff!important;}' +
        '.site-header,.post-meta-top,.site-footer{display:none!important;}';
      doc.head.appendChild(css);
      frame.style.height = doc.documentElement.scrollHeight + 'px';
    } catch (e) { /* cross-origin or not ready — leave default height */ }
  }

  function slugify(filename) {
    return 'post-' + filename.replace(/\.html$/i, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function metaContent(doc, name) {
    var el = doc.querySelector('meta[name="' + name + '"]');
    return el ? el.content.trim() : '';
  }

  // Every post's card metadata (title/date/tag/excerpt) lives in that post's
  // own <head> as <meta> tags — see posts/*.html. This is the only place
  // that data needs to be written; nothing here is duplicated by hand.
  async function loadPost(file) {
    var res = await fetch('posts/' + file);
    if (!res.ok) throw new Error('Failed to load posts/' + file);
    var html = await res.text();
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var date = metaContent(doc, 'post-date');
    return {
      file: file,
      id: slugify(file),
      title: metaContent(doc, 'post-title') || file,
      tag: metaContent(doc, 'post-tag') || 'Post',
      date: date,
      dateLabel: metaContent(doc, 'post-date-label') || date,
      excerpt: metaContent(doc, 'description')
    };
  }

  function renderPosts(posts) {
    var stack = document.getElementById('postStack');
    var list = document.getElementById('sidemenuList');
    stack.innerHTML = '';
    list.innerHTML = '';

    posts.forEach(function (post) {
      var article = document.createElement('article');
      article.className = 'post-card';
      article.id = post.id;
      article.innerHTML =
        '<div class="post-card-interior">' +
        '<div class="post-meta">' +
        '<span class="post-tag"></span>' +
        '<span class="post-date"></span>' +
        '</div>' +
        '<h2></h2>' +
        '<p class="post-excerpt"></p>' +
        '<div class="post-actions">' +
        '<a class="post-btn" target="_blank" rel="noopener">Link to this Article ↗</a>' +
        '</div>' +
        '<div class="post-body"><iframe title="" loading="lazy"></iframe></div>' +
        '</div>';
      article.querySelector('.post-tag').textContent = post.tag;
      article.querySelector('.post-date').textContent = post.dateLabel;
      article.querySelector('h2').textContent = post.title;
      article.querySelector('.post-excerpt').textContent = post.excerpt;
      var link = article.querySelector('.post-btn');
      link.href = 'posts/' + post.file;
      var frame = article.querySelector('iframe');
      frame.title = post.title;
      frame.src = 'posts/' + post.file;
      frame.addEventListener('load', function () { fitFrame(frame); });
      stack.appendChild(article);

      var sideLink = document.createElement('a');
      sideLink.href = '#' + post.id;
      sideLink.textContent = post.title;
      sideLink.addEventListener('click', function () { sidemenu.classList.remove('open'); });
      list.appendChild(sideLink);
    });

    window.addEventListener('resize', function () {
      document.querySelectorAll('.post-body iframe').forEach(fitFrame);
    });
  }

  async function init() {
    var status = document.getElementById('postsStatus');
    try {
      var manifestRes = await fetch('posts/manifest.json');
      if (!manifestRes.ok) throw new Error('Failed to load posts/manifest.json');
      var files = await manifestRes.json();
      var posts = await Promise.all(files.map(loadPost));
      posts.sort(function (a, b) { return b.date.localeCompare(a.date); });
      renderPosts(posts);
    } catch (err) {
      status.textContent = 'Could not load posts (' + err.message + '). If you opened this file directly, serve it over http:// instead — e.g. `python3 -m http.server` from the blog/ folder.';
      console.error(err);
    }
  }

  init();
})();
</script>
</body>
</html>
